name: Build and deploy Node.js app to Azure Web App - ITROne

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: itrone-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Build frontend
        working-directory: client
        env:
          VITE_API_URL: https://itrone-hycpage7deagfzdg.southindia-01.azurewebsites.net
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Install backend (production deps only)
        working-directory: server
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Stage deployment package
        run: |
          mkdir -p deploy/client
          cp -r server deploy/server
          cp -r client/dist deploy/client/dist
          rm -rf deploy/server/test deploy/server/vitest.config.js
          find deploy/server -name '*.test.js' -delete

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ITROne'
          package: deploy
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_338E6E4456EB475D857D2497DB99ABC7 }}
